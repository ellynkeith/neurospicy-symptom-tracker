<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behavior &amp; Symptom Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf6ee;
    --paper-dim: #f2ebdd;
    --ink: #2c2620;
    --ink-soft: #6b6155;
    --teal: #4f8a82;
    --teal-dim: #cfe2de;
    --line: #ddd3c0;
    --danger: #a8574a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    line-height: 1.5;
  }
  h1, h2, h3 {
    font-family: 'Lora', Georgia, serif;
    font-weight: 600;
    margin: 0;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.5rem; }
  header h1 em { font-style: italic; color: var(--teal); }
  .logged-by {
    font-size: 0.85rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logged-by input {
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    font: inherit;
    color: var(--ink);
    padding: 2px 4px;
    width: 110px;
  }
  .logged-by input:focus { outline: none; border-bottom-color: var(--teal); }

  section { margin-bottom: 36px; }
  .section-title {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  form { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
  .field label { font-size: 0.8rem; color: var(--ink-soft); }
  input, select, textarea {
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
  }
  textarea { resize: vertical; min-height: 56px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    background: #fff;
    color: var(--ink);
    user-select: none;
  }
  .chip.selected {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }
  .chip.add-new {
    border-style: dashed;
    color: var(--ink-soft);
  }

  .intensity { display: flex; gap: 6px; }
  .intensity button {
    flex: 1;
    border: 1px solid var(--line);
    background: #fff;
    padding: 8px 0;
    border-radius: 3px;
    cursor: pointer;
    font: inherit;
    color: var(--ink-soft);
  }
  .intensity button.selected {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }

  .submit-row { display: flex; justify-content: flex-end; align-items: center; gap: 16px; }
  button.primary {
    background: var(--teal);
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 3px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button.primary:hover { background: #437c74; }
  button.primary:disabled { background: var(--ink-soft); cursor: not-allowed; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .toolbar select { min-width: 160px; }
  .link-btn {
    background: none;
    border: none;
    color: var(--teal);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 4px 0;
    text-decoration: underline;
  }

  .day-group { margin-bottom: 28px; }
  details.period > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  details.period > summary::-webkit-details-marker { display: none; }
  details.period > summary::before {
    content: '▸';
    color: var(--ink-soft);
    font-size: 0.8rem;
    width: 0.8rem;
  }
  details.period[open] > summary::before { content: '▾'; }
  .period-title { font-family: 'Lora', Georgia, serif; font-size: 1.1rem; color: var(--ink); }
  details.period.year > summary .period-title { font-size: 1.25rem; }
  .period-meta { font-size: 0.8rem; color: var(--ink-soft); }
  details.period:not([open]) > summary { margin-bottom: 4px; }
  details.period.year > .period-body { padding-left: 14px; }
  .day-heading {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .entry {
    padding: 12px 0;
    border-bottom: 1px solid var(--paper-dim);
    display: flex;
    gap: 14px;
  }
  .entry:last-child { border-bottom: none; }
  .entry-time {
    width: 64px;
    flex-shrink: 0;
    color: var(--ink-soft);
    font-size: 0.85rem;
    padding-top: 2px;
  }
  .entry-body { flex: 1; }
  .entry-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .badge {
    display: inline-block;
    background: var(--teal-dim);
    color: #2c5750;
    font-size: 0.78rem;
    padding: 2px 10px;
    border-radius: 999px;
  }
  .badge.situation {
    background: transparent;
    border: 1px solid var(--teal);
    color: var(--teal);
  }
  .badge.response-noncompliant {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
  }
  .intensity-dots { display: inline-flex; gap: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--danger); }
  .entry-meta { font-size: 0.82rem; color: var(--ink-soft); }
  .entry-notes { font-size: 0.9rem; margin-top: 4px; }
  .entry-actions { margin-left: auto; display: flex; gap: 12px; }
  .delete-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 0.78rem;
    text-decoration: underline;
  }
  .delete-btn:hover { color: var(--danger); }

  .empty {
    color: var(--ink-soft);
    font-size: 0.9rem;
    padding: 20px 0;
    text-align: center;
  }
  .status {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 6px;
    min-height: 1em;
  }
  .status.error { color: var(--danger); }

  .demo-banner {
    background: var(--teal-dim);
    color: #2c5750;
    font-size: 0.85rem;
    text-align: center;
    padding: 8px 14px;
    border-radius: 3px;
    margin-bottom: 20px;
  }

  details.daily-details {
    margin-bottom: 36px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 16px;
  }
  details.daily-details summary {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
  }
  details.daily-details form { margin-top: 16px; }

  .daily-summary {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: -2px 0 10px;
  }
  .daily-summary-notes { margin: -6px 0 10px; }
  .day-empty {
    color: var(--ink-soft);
    font-size: 0.85rem;
    font-style: italic;
    padding: 4px 0 12px;
  }

  .wetting-section {
    border-top: 1px solid var(--line);
    margin-top: 4px;
    padding-top: 16px;
  }
  .wetting-section-label {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .wetting-list { margin-bottom: 12px; }
  .wetting-item {
    padding: 6px 0;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--paper-dim);
  }
  .wetting-item:last-child { border-bottom: none; }
  .wetting-item-head { display: flex; align-items: center; gap: 10px; }
  .wetting-item .entry-time { width: 64px; flex-shrink: 0; color: var(--ink-soft); font-size: 0.85rem; }
  .wetting-item .wetting-setting { color: var(--ink-soft); flex: 1; }
  .wetting-item-notes { font-size: 0.82rem; color: var(--ink-soft); margin-top: 4px; }
  .wetting-empty {
    color: var(--ink-soft);
    font-size: 0.82rem;
    font-style: italic;
    padding: 4px 0 12px;
  }
  .wetting-add-row { align-items: flex-end; }

  .medication-section {
    border-top: 1px solid var(--line);
    margin-top: 4px;
    padding-top: 16px;
  }
  .medication-list { margin-bottom: 12px; }
  .medication-item {
    padding: 6px 0;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--paper-dim);
  }
  .medication-item:last-child { border-bottom: none; }
  .medication-item-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
  .medication-item-head .badge { white-space: nowrap; }
  .chip.hidden-med { border-style: dashed; color: var(--ink-soft); }
  .chip.hidden-med.selected { color: #fff; }
  .manage-meds-btn { margin-top: 8px; padding: 0; }
  .manage-meds { margin-top: 8px; border: 1px solid var(--line); border-radius: 3px; padding: 4px 12px; background: #fff; }
  .manage-meds-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; font-size: 0.88rem; border-bottom: 1px solid var(--paper-dim);
  }
  .manage-meds-row:last-child { border-bottom: none; }
  .manage-meds-row.is-hidden span { color: var(--ink-soft); text-decoration: line-through; }
  .medication-item-notes { font-size: 0.82rem; color: var(--ink-soft); margin-top: 4px; }
  .medication-empty {
    color: var(--ink-soft);
    font-size: 0.82rem;
    font-style: italic;
    padding: 4px 0 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="demoBanner" class="demo-banner" hidden>
    You're viewing demo data — nothing you add or delete here is saved to the real log.
  </div>
  <header>
    <h1><em>Behavior</em> &amp; Symptom Log</h1>
    <div class="logged-by">
      Logging as
      <input id="loggedByInput" type="text" placeholder="your name">
    </div>
  </header>

  <section>
    <div class="section-title" id="entrySectionTitle">New entry</div>
    <form id="entryForm">
      <div class="row">
        <div class="field">
          <label for="entryDate">Date</label>
          <input type="date" id="entryDate" required>
        </div>
        <div class="field">
          <label for="entryTime">Time</label>
          <input type="time" id="entryTime">
        </div>
      </div>

      <div class="field">
        <label>Categories (pick one or more)</label>
        <div class="chips" id="categoryChips"></div>
      </div>

      <div class="row">
        <div class="field">
          <label for="settingSelect">Setting</label>
          <select id="settingSelect">
            <option value="">—</option>
            <option value="home">Home</option>
            <option value="school">School</option>
            <option value="transitions">Transitions</option>
            <option value="public">Public</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="durationInput">Duration (min)</label>
          <input type="number" id="durationInput" min="0" step="1" placeholder="e.g. 15">
        </div>
      </div>

      <div class="field">
        <label>Intensity</label>
        <div class="intensity" id="intensityPicker">
          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="3">3</button>
          <button type="button" data-value="4">4</button>
          <button type="button" data-value="5">5</button>
        </div>
      </div>

      <div class="field">
        <label>Situation / demand (optional)</label>
        <div class="chips" id="situationChips"></div>
      </div>

      <div class="field">
        <label for="notesInput">Notes</label>
        <textarea id="notesInput" placeholder="What happened, what helped, anything else worth remembering"></textarea>
      </div>

      <div class="submit-row">
        <button type="button" class="link-btn" id="cancelEditBtn" hidden>Cancel edit</button>
        <button type="submit" class="primary" id="submitBtn">Log entry</button>
      </div>
      <div class="status" id="formStatus"></div>
    </form>
  </section>

  <details class="daily-details" id="dailyDetails">
    <summary>Daily context (how the day went, sleep, wetting incidents &amp; medications, optional)</summary>
    <form id="dailyForm">
      <div class="row">
        <div class="field">
          <label for="dailyDate">Date</label>
          <input type="date" id="dailyDate">
        </div>
      </div>
      <div class="field">
        <label>How was the day?</label>
        <div class="chips">
          <div class="chip" id="goodDayChip" role="button" aria-pressed="false">Had a good day</div>
        </div>
      </div>
      <div class="field">
        <label>Overall (optional, 1 = rough · 5 = great)</label>
        <div class="intensity" id="dayRatingPicker">
          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="3">3</button>
          <button type="button" data-value="4">4</button>
          <button type="button" data-value="5">5</button>
        </div>
      </div>
      <div class="field">
        <label for="dayNotesInput">Comments on the day (optional)</label>
        <textarea id="dayNotesInput" placeholder="What made it a good (or hard) day?"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label for="wakeTimeInput">Woke up</label>
          <input type="time" id="wakeTimeInput">
        </div>
        <div class="field">
          <label for="bedtimeInput">Bedtime</label>
          <input type="time" id="bedtimeInput">
        </div>
        <div class="field">
          <label for="fellAsleepInput">Fell asleep</label>
          <input type="time" id="fellAsleepInput">
        </div>
        <div class="field">
          <label for="nightAwakeningsInput">Night awakenings</label>
          <input type="number" id="nightAwakeningsInput" min="0" step="1" placeholder="e.g. 1">
        </div>
      </div>
      <div class="submit-row">
        <button type="submit" class="primary" id="dailySubmitBtn">Save daily context</button>
      </div>
      <div class="status" id="dailyStatus"></div>
    </form>

    <div class="wetting-section">
      <div class="wetting-section-label">Wetting incidents for this date</div>
      <div class="wetting-list" id="wettingList"></div>
      <div class="row wetting-add-row">
        <div class="field">
          <label for="wettingTimeInput">Time</label>
          <input type="time" id="wettingTimeInput">
        </div>
        <div class="field">
          <label for="wettingSettingSelect">Where</label>
          <select id="wettingSettingSelect">
            <option value="">—</option>
            <option value="home">Home</option>
            <option value="school">School</option>
            <option value="transitions">Transitions</option>
            <option value="public">Public</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="wettingResponseSelect">Response</label>
          <select id="wettingResponseSelect">
            <option value="">—</option>
            <option value="compliant">Compliant</option>
            <option value="noncompliant">Noncompliant</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <button type="button" class="link-btn" id="cancelWettingEditBtn" hidden>Cancel edit</button>
          <button type="button" class="primary" id="addWettingBtn">Add incident</button>
        </div>
      </div>
      <div class="field">
        <label for="wettingNotesInput">Additional details (optional)</label>
        <textarea id="wettingNotesInput" placeholder="What was going on right before, how she reacted after, anything else worth remembering"></textarea>
      </div>
      <div class="status" id="wettingStatus"></div>
    </div>

    <div class="medication-section">
      <div class="wetting-section-label">Medications for this date</div>
      <div class="medication-list" id="medicationList"></div>
      <div class="field">
        <label>Medication(s)</label>
        <div class="chips" id="medicationChips"></div>
        <button type="button" class="link-btn manage-meds-btn" id="manageMedsBtn">Hide or show medications</button>
        <div class="manage-meds" id="manageMedsPanel" hidden></div>
      </div>
      <div class="row wetting-add-row">
        <div class="field">
          <label for="medicationTimeInput">Time</label>
          <input type="time" id="medicationTimeInput">
        </div>
        <div class="field">
          <button type="button" class="link-btn" id="cancelMedicationEditBtn" hidden>Cancel edit</button>
          <button type="button" class="primary" id="addMedicationBtn">Add dose</button>
        </div>
      </div>
      <div class="field">
        <label for="medicationNotesInput">Additional details (optional)</label>
        <textarea id="medicationNotesInput" placeholder="Anything else worth remembering"></textarea>
      </div>
      <div class="status" id="medicationStatus"></div>
    </div>
  </details>

  <section>
    <div class="toolbar">
      <div class="section-title" style="margin-bottom:0;">Entries</div>
      <div style="display:flex; gap:12px; align-items:center;">
        <select id="filterSelect">
          <option value="">All categories</option>
        </select>
        <button class="link-btn" id="exportBtn">Export CSV</button>
      </div>
    </div>
    <div id="entriesList"></div>
  </section>
</div>

<script>
const API = '/api';
let categories = [];
let situations = [];
let entries = [];
let dailyLogs = [];
let dailyLogMap = {};
let wettingIncidents = [];
let wettingByDate = {};
let medications = [];
let medicationDoses = [];
let medicationsByDate = {};

function todayStr() {
  // Deliberately NOT toISOString() -- that formats in UTC, so anyone west
  // of UTC (all of the US) would see the date roll over to tomorrow in the
  // evening, hours before midnight actually arrives locally. Build the
  // string from the local date components instead.
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}
function nowStr() {
  const d = new Date();
  return d.toTimeString().slice(0, 5);
}

// ---- logged-by name, per-browser ----
const loggedByInput = document.getElementById('loggedByInput');
loggedByInput.value = localStorage.getItem('loggedByName') || '';
loggedByInput.addEventListener('change', () => {
  localStorage.setItem('loggedByName', loggedByInput.value.trim());
});

// ---- defaults ----
document.getElementById('entryDate').value = todayStr();
document.getElementById('entryTime').value = nowStr();

// ---- category chips (multi-select) ----
let selectedCategories = new Set();
const categoryChips = document.getElementById('categoryChips');
const filterSelect = document.getElementById('filterSelect');

function renderCategoryChips() {
  categoryChips.innerHTML = '';
  categories.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedCategories.has(cat) ? ' selected' : '');
    chip.textContent = cat;
    chip.addEventListener('click', () => {
      if (selectedCategories.has(cat)) {
        selectedCategories.delete(cat);
      } else {
        selectedCategories.add(cat);
      }
      renderCategoryChips();
    });
    categoryChips.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip add-new';
  addChip.textContent = '+ new';
  addChip.addEventListener('click', async () => {
    const name = prompt('New category name:');
    if (!name || !name.trim()) return;
    await fetch(`${API}/categories`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim() })
    });
    await loadCategories();
    selectedCategories.add(name.trim().toLowerCase());
    renderCategoryChips();
  });
  categoryChips.appendChild(addChip);
}

function renderFilterOptions() {
  const current = filterSelect.value;
  filterSelect.innerHTML = '<option value="">All categories</option>';
  categories.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    filterSelect.appendChild(opt);
  });
  filterSelect.value = current;
}

async function loadCategories() {
  const res = await fetch(`${API}/categories`);
  categories = await res.json();
  renderCategoryChips();
  renderFilterOptions();
}

// ---- situation/demand chips (multi-select, optional) ----
let selectedSituations = new Set();
const situationChips = document.getElementById('situationChips');

function renderSituationChips() {
  situationChips.innerHTML = '';
  situations.forEach(sit => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedSituations.has(sit) ? ' selected' : '');
    chip.textContent = sit;
    chip.addEventListener('click', () => {
      if (selectedSituations.has(sit)) {
        selectedSituations.delete(sit);
      } else {
        selectedSituations.add(sit);
      }
      renderSituationChips();
    });
    situationChips.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip add-new';
  addChip.textContent = '+ new';
  addChip.addEventListener('click', async () => {
    const name = prompt('New situation/demand name:');
    if (!name || !name.trim()) return;
    await fetch(`${API}/situations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim() })
    });
    await loadSituations();
    selectedSituations.add(name.trim().toLowerCase());
    renderSituationChips();
  });
  situationChips.appendChild(addChip);
}

async function loadSituations() {
  const res = await fetch(`${API}/situations`);
  situations = await res.json();
  renderSituationChips();
}

// ---- daily context (sleep, one row per date, independent of how many

let goodDay = false;

function renderGoodDayChip() {
  goodDayChip.classList.toggle('selected', goodDay);
  goodDayChip.setAttribute('aria-pressed', goodDay ? 'true' : 'false');
}
goodDayChip.addEventListener('click', () => { goodDay = !goodDay; renderGoodDayChip(); });

function renderDayRating() {
  dayRatingPicker.querySelectorAll('button').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.value, 10) === selectedDayRating);
  });
}
dayRatingPicker.querySelectorAll('button').forEach(btn => {

    const v = parseInt(btn.dataset.value, 10);
    selectedDayRating = (selectedDayRating === v) ? null : v;
    renderDayRating();
  });
});

function hasDailyContent(log) {
  return !!log && (
    log.wake_time != null || log.bedtime != null || log.fell_asleep_time != null ||
    log.night_awakenings != null || log.good_day || log.day_rating != null || !!log.day_notes
  );
}

function fmtDailySummary(log) {
  const parts = [];
  if (log.good_day || log.day_rating != null) {
    const dayParts = [];
    if (log.good_day) dayParts.push('Good day');
    if (log.day_rating != null) dayParts.push(`Overall ${log.day_rating}/5`);
    parts.push(dayParts.join(' · '));
  }
  if (log.wake_time || log.bedtime || log.fell_asleep_time || log.night_awakenings != null) {
    let sleepPart = (log.wake_time || log.bedtime)
      ? `Woke ${log.wake_time ? fmtTime(log.wake_time) : '?'} · Bed ${log.bedtime ? fmtTime(log.bedtime) : '?'}`
      : 'Sleep';
    if (log.fell_asleep_time) {
      sleepPart += ` (asleep ~${fmtTime(log.fell_asleep_time)})`;
    }
    if (log.night_awakenings != null) {
      sleepPart += ` · ${log.night_awakenings} waking${log.night_awakenings === 1 ? '' : 's'}`;
    }
    parts.push(sleepPart);
  }
  return parts.join('   ·   ');
}

function populateDailyFormForDate(dateStr) {
  const log = dailyLogMap[dateStr];
  wakeTimeInput.value = log && log.wake_time ? log.wake_time.slice(0, 5) : '';
  bedtimeInput.value = log && log.bedtime ? log.bedtime.slice(0, 5) : '';
  fellAsleepInput.value = log && log.fell_asleep_time ? log.fell_asleep_time.slice(0, 5) : '';
  nightAwakeningsInput.value = (log && log.night_awakenings != null) ? log.night_awakenings : '';
  goodDay = !!(log && log.good_day);
  renderGoodDayChip();
  selectedDayRating = (log && log.day_rating != null) ? log.day_rating : null;
  renderDayRating();
  dayNotesInput.value = (log && log.day_notes) ? log.day_notes : '';
}

function renderMedicationChips() {
  medicationChips.innerHTML = '';
  // Active meds only -- plus any hidden med already on the dose being
  // edited, so re-saving an old dose never silently drops it.
  const visible = medications.filter(m => m.active || selectedMedications.includes(m.name));
  visible.forEach(m => {
    const med = m.name;
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedMedications.includes(med) ? ' selected' : '') + (m.active ? '' : ' hidden-med');
    chip.textContent = m.active ? med : `${med} (hidden)`;
    chip.addEventListener('click', () => {
      selectedMedications = selectedMedications.includes(med)
        ? selectedMedications.filter(m => m !== med)
        : [...selectedMedications, med];
      renderMedicationChips();
    });
    medicationChips.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip add-new';
  addChip.textContent = '+ new';
  addChip.addEventListener('click', async () => {
    const name = prompt('New medication name (dose can go right in the name, e.g. "Methylphenidate 10mg"):');
    if (!name || !name.trim()) return;
    await fetch(`${API}/medications`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim() })
    });
    await loadMedications();
    const newName = name.trim().toLowerCase();
    if (!selectedMedications.includes(newName)) selectedMedications = [...selectedMedications, newName];
    renderMedicationChips();
  });
  medicationChips.appendChild(addChip);
}

function fmtDayHeading(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function fmtTime(t) {
  if (!t) return '—';
  const [h, m] = t.split(':');
  const hour = parseInt(h, 10);
  const ampm = hour >= 12 ? 'PM' : 'AM';
  const h12 = ((hour + 11) % 12) + 1;
  return `${h12}:${m} ${ampm}`;
}

function renderEntries() {
  const filter = filterSelect.value;
  const filtered = filter ? entries.filter(e => (e.categories || []).includes(filter)) : entries;

  const groups = {};
  filtered.forEach(e => {
    const key = e.entry_date;
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  // With no category filter active, also surface days that only have daily
  // context (sleep) logged and zero behavior entries -- a quiet day is
  // itself useful signal for spotting patterns. Skip this when a filter is
  // active since the point of filtering is to narrow to entries.
  if (!filter) {
    dailyLogs.forEach(log => {
      if (!groups[log.entry_date]) groups[log.entry_date] = [];
    });
    Object.keys(wettingByDate).forEach(dateStr => {
      if (!groups[dateStr]) groups[dateStr] = [];
    });
    Object.keys(medicationsByDate).forEach(dateStr => {
      if (!groups[dateStr]) groups[dateStr] = [];
    });
  }

  entriesList.innerHTML = '';
  const dateKeys = Object.keys(groups);
  if (!dateKeys.length) {
    entriesList.innerHTML = '<div class="empty">No entries logged yet.</div>';
    return;

  const periods = makePeriodContainers();

  dateKeys.sort((a, b) => b.localeCompare(a)).forEach(dateStr => {

      group.appendChild(summary);
      if (dailyLog.day_notes) {
        const dayNotes = document.createElement('div');
        dayNotes.className = 'entry-notes daily-summary-notes';
        dayNotes.textContent = dailyLog.day_notes;
        group.appendChild(dayNotes);
      }
    }

    // Wetting incidents, medication doses and behavior entries are collected
    // here and appended in time order at the end, instead of grouped by type.
    const dayItems = [];

    (wettingByDate[dateStr] || []).forEach(w => {
      const wRow = document.createElement('div');

        wNotes.textContent = w.notes;
        wBody.appendChild(wNotes);
      }

      wRow.appendChild(wBody);
      dayItems.push({ time: w.incident_time, el: wRow });
    });

    (medicationsByDate[dateStr] || []).forEach(d => {

      dDelBtn.className = 'delete-btn';
      dDelBtn.textContent = 'delete';
      dDelBtn.addEventListener('click', () => deleteMedicationDose(d.id));
      dActions.appendChild(dDelBtn);
      dHead.appendChild(dActions);

      dBody.appendChild(dHead);

      if (d.notes) {
        const dNotes = document.createElement('div');
        dNotes.className = 'entry-notes';
        dNotes.textContent = d.notes;
        dBody.appendChild(dNotes);
      }

      dRow.appendChild(dBody);
      dayItems.push({ time: d.taken_time, el: dRow });
    });

    // Only on days nobody has marked yet -- on a good day it's redundant, and
    // leaving it on unmarked days flags the ones that are still ambiguous.
    if (!groups[dateStr].length && !(dailyLog && dailyLog.good_day)) {
      const dayEmpty = document.createElement('div');
      dayEmpty.className = 'day-empty';
      dayEmpty.textContent = 'No behavior entries logged.';
      group.appendChild(dayEmpty);
    }

    groups[dateStr].forEach(e => {
      const row = document.createElement('div');
      row.className = 'entry';

      const time = document.createElement('div');
      time.className = 'entry-time';
      time.textContent = fmtTime(e.entry_time);
      row.appendChild(time);

      const body = document.createElement('div');
      body.className = 'entry-body';

      const head = document.createElement('div');
      head.className = 'entry-head';

      (e.categories || []).forEach(cat => {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = cat;
        head.appendChild(badge);
      });

      (e.situations || []).forEach(sit => {
        const badge = document.createElement('span');
        badge.className = 'badge situation';
        badge.textContent = sit;
        head.appendChild(badge);
      });

      if (e.intensity) {
        const dots = document.createElement('span');
        dots.className = 'intensity-dots';
        for (let i = 1; i <= 5; i++) {
          const dot = document.createElement('span');
          dot.className = 'dot' + (i <= e.intensity ? ' on' : '');
          dots.appendChild(dot);
        }
        head.appendChild(dots);
      }

      const actions = document.createElement('span');
      actions.className = 'entry-actions';
      const editBtn = document.createElement('button');
      editBtn.className = 'delete-btn';
      editBtn.textContent = 'edit';
      editBtn.addEventListener('click', () => startEditEntry(e));
      actions.appendChild(editBtn);
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = 'delete';
      delBtn.addEventListener('click', () => deleteEntry(e.id));
      actions.appendChild(delBtn);
      head.appendChild(actions);

      body.appendChild(head);

      const metaParts = [];
      if (e.setting) metaParts.push(e.setting);
      if (e.duration_minutes) metaParts.push(`${e.duration_minutes} min`);
      if (e.logged_by) metaParts.push(`logged by ${e.logged_by}`);
      if (metaParts.length) {
        const meta = document.createElement('div');
        meta.className = 'entry-meta';
        meta.textContent = metaParts.join(' · ');
        body.appendChild(meta);
      }

      if (e.notes) {
        const notes = document.createElement('div');
        notes.className = 'entry-notes';
        notes.textContent = e.notes;
        body.appendChild(notes);
      }

      row.appendChild(body);
      dayItems.push({ time: e.entry_time, el: row });
    });

    // Earliest first within the day; anything without a time goes last.
    // Array sort is stable, so same-time items keep their order.
    dayItems
      .sort((a, b) => {
        if (!a.time && !b.time) return 0;
        if (!a.time) return 1;
        if (!b.time) return -1;
        return a.time.localeCompare(b.time);
      })
      .forEach(item => group.appendChild(item.el));

    periods.add(dateStr, group, groups[dateStr].length);
  });
  periods.finish();
}

// ---- month/year collapsing for the entries list ----
// Days nest inside a collapsible month; months from past years nest inside
// a collapsible year. A month stays open if it holds any day from the last
// RECENT_DAYS days (so on the 1st, last month doesn't vanish), everything
// older starts collapsed. Once someone opens or closes a month/year by
// hand, that choice sticks across re-renders (every save re-renders).
const RECENT_DAYS = 14;
const periodOpenState = {};  // period key ('2026-09' or '2025') -> bool

function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function makePeriodContainers() {
  const now = new Date();
  const currentYear = String(now.getFullYear());
  const cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate() - RECENT_DAYS);
  const cutoffMonth = localDateStr(cutoff).slice(0, 7);
  const years = {};
  const months = {};

  function makePeriod(key, label, kind, defaultOpen, parent) {
    const details = document.createElement('details');
    details.className = `period ${kind}`;
    details.open = (key in periodOpenState) ? periodOpenState[key] : defaultOpen;
    const summary = document.createElement('summary');
    const title = document.createElement('span');
    title.className = 'period-title';
    title.textContent = label;
    const meta = document.createElement('span');
    meta.className = 'period-meta';
    summary.appendChild(title);
    summary.appendChild(meta);
    details.appendChild(summary);
    const body = document.createElement('div');
    body.className = 'period-body';
    details.appendChild(body);
    details.addEventListener('toggle', () => { periodOpenState[key] = details.open; });
    parent.appendChild(details);
    return { details, body, meta, days: 0, entries: 0 };
  }

  function add(dateStr, dayEl, entryCount) {
    const y = dateStr.slice(0, 4);
    const ym = dateStr.slice(0, 7);
    if (!months[ym]) {
      let parent = entriesList;
      if (y !== currentYear) {
        if (!years[y]) years[y] = makePeriod(y, y, 'year', ym >= cutoffMonth, entriesList);
        parent = years[y].body;
      }
      const label = new Date(`${ym}-01T00:00:00`).toLocaleDateString(undefined,
        y === currentYear ? { month: 'long' } : { month: 'long', year: 'numeric' });
      months[ym] = makePeriod(ym, y === currentYear ? `${label} ${y}` : label, 'month', ym >= cutoffMonth, parent);
    }
    months[ym].body.appendChild(dayEl);
    months[ym].days += 1;
    months[ym].entries += entryCount;
    if (years[y]) { years[y].days += 1; years[y].entries += entryCount; }
  }

  function fmtMeta(p) {
    return `${p.days} day${p.days === 1 ? '' : 's'} · ${p.entries} entr${p.entries === 1 ? 'y' : 'ies'}`;
  }

  function finish() {
    Object.values(months).forEach(p => { p.meta.textContent = fmtMeta(p); });
    Object.values(years).forEach(p => { p.meta.textContent = fmtMeta(p); });
  }

  return { add, finish };
}

async function loadEntries() {
  const res = await fetch(`${API}/entries`);
  entries = await res.json();
  renderEntries();
}

async function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  await fetch(`${API}/entries/${id}`, { method: 'DELETE' });
  await loadEntries();
}

// ---- editing an existing entry (reuses the "New entry" form) ----
let editingEntryId = null;
// The name typed into "Logging as" is per-browser and persists across
// entries -- editing someone else's entry shouldn't silently reassign it
// to whoever happens to be editing, so their own name is restored once
// the edit finishes or is cancelled.
let editRestoreLoggedBy = null;
const entrySectionTitle = document.getElementById('entrySectionTitle');
const cancelEditBtn = document.getElementById('cancelEditBtn');

function startEditEntry(e) {
  editingEntryId = e.id;
  editRestoreLoggedBy = loggedByInput.value;

  document.getElementById('entryDate').value = e.entry_date;
  document.getElementById('entryTime').value = e.entry_time ? e.entry_time.slice(0, 5) : '';
  document.getElementById('settingSelect').value = e.setting || '';
  document.getElementById('durationInput').value = e.duration_minutes != null ? e.duration_minutes : '';
  document.getElementById('notesInput').value = e.notes || '';
  loggedByInput.value = e.logged_by || '';

  selectedCategories = new Set(e.categories || []);
  selectedSituations = new Set(e.situations || []);
  renderCategoryChips();
  renderSituationChips();

  selectedIntensity = e.intensity || null;
  intensityPicker.querySelectorAll('button').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.value, 10) === selectedIntensity);
  });

  entrySectionTitle.textContent = 'Edit entry';
  submitBtn.textContent = 'Update entry';
  cancelEditBtn.hidden = false;
  formStatus.textContent = '';
  formStatus.classList.remove('error');

  if (form.scrollIntoView) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function endEditEntry() {
  editingEntryId = null;
  if (editRestoreLoggedBy !== null) {
    loggedByInput.value = editRestoreLoggedBy;
    editRestoreLoggedBy = null;
  }
  entrySectionTitle.textContent = 'New entry';
  submitBtn.textContent = 'Log entry';
  cancelEditBtn.hidden = true;
}

cancelEditBtn.addEventListener('click', () => {
  endEditEntry();
  selectedCategories = new Set();
  selectedSituations = new Set();
  selectedIntensity = null;
  renderCategoryChips();
  renderSituationChips();
  intensityPicker.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
  document.getElementById('settingSelect').value = '';
  document.getElementById('durationInput').value = '';
  document.getElementById('notesInput').value = '';
  document.getElementById('entryDate').value = todayStr();
  document.getElementById('entryTime').value = nowStr();
  formStatus.textContent = '';
  formStatus.classList.remove('error');
});

filterSelect.addEventListener('change', renderEntries);

// ---- export CSV ----
document.getElementById('exportBtn').addEventListener('click', () => {
  const filter = filterSelect.value;
  const rows = filter ? entries.filter(e => (e.categories || []).includes(filter)) : entries;
  const headers = ['date', 'time', 'categories', 'setting', 'duration_minutes', 'intensity', 'situations', 'notes', 'logged_by'];
  const csvRows = [headers.join(',')];
  rows.forEach(e => {
    const line = headers.map(h => {
      const key = h === 'date' ? 'entry_date' : (h === 'time' ? 'entry_time' : h);
      let val;
      if (h === 'categories') {
        val = (e.categories || []).join('; ');
      } else if (h === 'situations') {
        val = (e.situations || []).join('; ');
      } else {
        val = e[key] == null ? '' : String(e[key]);
      }
      val = val.replace(/"/g, '""');
      if (val.includes(',') || val.includes('"') || val.includes('\n')) val = `"${val}"`;
      return val;
    });
    csvRows.push(line.join(','));
  });
  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `behavior-log-${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

// ---- form submit ----
const form = document.getElementById('entryForm');
const formStatus = document.getElementById('formStatus');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  formStatus.textContent = '';
  formStatus.classList.remove('error');

  if (selectedCategories.size === 0) {
    formStatus.textContent = 'Pick at least one category.';
    formStatus.classList.add('error');
    return;
  }

  const payload = {
    entry_date: document.getElementById('entryDate').value,
    entry_time: document.getElementById('entryTime').value || null,
    categories: Array.from(selectedCategories),
    setting: document.getElementById('settingSelect').value || null,
    duration_minutes: document.getElementById('durationInput').value ? parseInt(document.getElementById('durationInput').value, 10) : null,
    intensity: selectedIntensity,
    situations: Array.from(selectedSituations),
    notes: document.getElementById('notesInput').value || null,
    logged_by: loggedByInput.value.trim() || null,
  };

  const isEditing = editingEntryId !== null;

  submitBtn.disabled = true;
  try {
    const res = await fetch(isEditing ? `${API}/entries/${editingEntryId}` : `${API}/entries`, {
      method: isEditing ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());

    // reset the parts of the form that shouldn't carry over
    selectedCategories = new Set();
    selectedSituations = new Set();
    selectedIntensity = null;
    renderCategoryChips();
    renderSituationChips();
    intensityPicker.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
    document.getElementById('durationInput').value = '';
    document.getElementById('notesInput').value = '';
    document.getElementById('entryTime').value = nowStr();

    if (isEditing) {
      // Finishing an edit clears the date back to today too, so the form
      // doesn't linger on whatever past date was just edited for the next
      // new entry.
      document.getElementById('entryDate').value = todayStr();
      endEditEntry();
    }

    await loadEntries();
    formStatus.textContent = isEditing ? 'Updated.' : 'Logged.';
  } catch (err) {
    formStatus.textContent = 'Could not save — check your connection and try again.';
    formStatus.classList.add('error');
  } finally {
    submitBtn.disabled = false;
  }
});

// ---- daily context form submit ----
const dailyForm = document.getElementById('dailyForm');
const dailyStatus = document.getElementById('dailyStatus');
const dailySubmitBtn = document.getElementById('dailySubmitBtn');

dailyForm.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  dailyStatus.textContent = '';
  dailyStatus.classList.remove('error');

  const payload = {
    entry_date: dailyDateInput.value,
    wake_time: wakeTimeInput.value || null,
    bedtime: bedtimeInput.value || null,
    fell_asleep_time: fellAsleepInput.value || null,
    night_awakenings: nightAwakeningsInput.value ? parseInt(nightAwakeningsInput.value, 10) : null,
    good_day: goodDay || null,
    day_rating: selectedDayRating,
    day_notes: dayNotesInput.value.trim() || null,
  };

  dailySubmitBtn.disabled = true;
  try {
    const res = await fetch(`${API}/daily`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());
    await loadDailyLogs();
    renderEntries();
    dailyStatus.textContent = 'Saved.';
  } catch (err) {
    dailyStatus.textContent = 'Could not save — check your connection and try again.';
    dailyStatus.classList.add('error');
  } finally {
    dailySubmitBtn.disabled = false;
  }
});

// ---- init ----
async function loadWhoami() {
  try {
    const res = await fetch(`${API}/whoami`);
    const data = await res.json();
    document.getElementById('demoBanner').hidden = !data.demo;
  } catch (err) {
    // Non-critical -- if this fails, just leave the banner hidden.
  }
}

(async function init() {
  dailyDateInput.value = todayStr();
  await loadWhoami();
  await loadCategories();
  await loadSituations();
  await loadMedications();
  await loadDailyLogs();
  populateDailyFormForDate(dailyDateInput.value);
  await loadWettingIncidents();
  renderWettingListForDate(dailyDateInput.value);
  await loadMedicationDoses();
  renderMedicationListForDate(dailyDateInput.value);
  await loadEntries();
})();
</script>
