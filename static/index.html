<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behavior &amp; Symptom Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf6ee;
    --paper-dim: #f2ebdd;
    --ink: #2c2620;
    --ink-soft: #6b6155;
    --teal: #4f8a82;
    --teal-dim: #cfe2de;
    --line: #ddd3c0;
    --danger: #a8574a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    line-height: 1.5;
  }
  h1, h2, h3 {
    font-family: 'Lora', Georgia, serif;
    font-weight: 600;
    margin: 0;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.5rem; }
  header h1 em { font-style: italic; color: var(--teal); }
  .logged-by {
    font-size: 0.85rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logged-by input {
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    font: inherit;
    color: var(--ink);
    padding: 2px 4px;
    width: 110px;
  }
  .logged-by input:focus { outline: none; border-bottom-color: var(--teal); }

  section { margin-bottom: 36px; }
  .section-title {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  form { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
  .field label { font-size: 0.8rem; color: var(--ink-soft); }
  input, select, textarea {
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
  }
  textarea { resize: vertical; min-height: 56px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    background: #fff;
    color: var(--ink);
    user-select: none;
  }
  .chip.selected {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }
  .chip.add-new {
    border-style: dashed;
    color: var(--ink-soft);
  }

  .intensity { display: flex; gap: 6px; }
  .intensity button {
    flex: 1;
    border: 1px solid var(--line);
    background: #fff;
    padding: 8px 0;
    border-radius: 3px;
    cursor: pointer;
    font: inherit;
    color: var(--ink-soft);
  }
  .intensity button.selected {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }

  .submit-row { display: flex; justify-content: flex-end; }
  button.primary {
    background: var(--teal);
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 3px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button.primary:hover { background: #437c74; }
  button.primary:disabled { background: var(--ink-soft); cursor: not-allowed; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .toolbar select { min-width: 160px; }
  .link-btn {
    background: none;
    border: none;
    color: var(--teal);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 4px 0;
    text-decoration: underline;
  }

  .day-group { margin-bottom: 28px; }
  .day-heading {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .entry {
    padding: 12px 0;
    border-bottom: 1px solid var(--paper-dim);
    display: flex;
    gap: 14px;
  }
  .entry:last-child { border-bottom: none; }
  .entry-time {
    width: 64px;
    flex-shrink: 0;
    color: var(--ink-soft);
    font-size: 0.85rem;
    padding-top: 2px;
  }
  .entry-body { flex: 1; }
  .entry-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .badge {
    display: inline-block;
    background: var(--teal-dim);
    color: #2c5750;
    font-size: 0.78rem;
    padding: 2px 10px;
    border-radius: 999px;
  }
  .badge.situation {
    background: transparent;
    border: 1px solid var(--teal);
    color: var(--teal);
  }
  .badge.response-noncompliant {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
  }
  .intensity-dots { display: inline-flex; gap: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--danger); }
  .entry-meta { font-size: 0.82rem; color: var(--ink-soft); }
  .entry-notes { font-size: 0.9rem; margin-top: 4px; }
  .entry-actions { margin-left: auto; }
  .delete-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 0.78rem;
    text-decoration: underline;
  }
  .delete-btn:hover { color: var(--danger); }

  .empty {
    color: var(--ink-soft);
    font-size: 0.9rem;
    padding: 20px 0;
    text-align: center;
  }
  .status {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 6px;
    min-height: 1em;
  }
  .status.error { color: var(--danger); }

  .demo-banner {
    background: var(--teal-dim);
    color: #2c5750;
    font-size: 0.85rem;
    text-align: center;
    padding: 8px 14px;
    border-radius: 3px;
    margin-bottom: 20px;
  }

  details.daily-details {
    margin-bottom: 36px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 16px;
  }
  details.daily-details summary {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
  }
  details.daily-details form { margin-top: 16px; }

  .daily-summary {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: -2px 0 10px;
  }
  .day-empty {
    color: var(--ink-soft);
    font-size: 0.85rem;
    font-style: italic;
    padding: 4px 0 12px;
  }

  .wetting-section {
    border-top: 1px solid var(--line);
    margin-top: 4px;
    padding-top: 16px;
  }
  .wetting-section-label {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .wetting-list { margin-bottom: 12px; }
  .wetting-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--paper-dim);
  }
  .wetting-item:last-child { border-bottom: none; }
  .wetting-item .entry-time { width: 64px; flex-shrink: 0; color: var(--ink-soft); font-size: 0.85rem; }
  .wetting-item .wetting-setting { color: var(--ink-soft); flex: 1; }
  .wetting-empty {
    color: var(--ink-soft);
    font-size: 0.82rem;
    font-style: italic;
    padding: 4px 0 12px;
  }
  .wetting-add-row { align-items: flex-end; }
</style>
</head>
<body>
<div class="wrap">
  <div id="demoBanner" class="demo-banner" hidden>
    You're viewing demo data — nothing you add or delete here is saved to the real log.
  </div>
  <header>
    <h1><em>Behavior</em> &amp; Symptom Log</h1>
    <div class="logged-by">
      Logging as
      <input id="loggedByInput" type="text" placeholder="your name">
    </div>
  </header>

  <section>
    <div class="section-title">New entry</div>
    <form id="entryForm">
      <div class="row">
        <div class="field">
          <label for="entryDate">Date</label>
          <input type="date" id="entryDate" required>
        </div>
        <div class="field">
          <label for="entryTime">Time</label>
          <input type="time" id="entryTime">
        </div>
      </div>

      <div class="field">
        <label>Categories (pick one or more)</label>
        <div class="chips" id="categoryChips"></div>
      </div>

      <div class="row">
        <div class="field">
          <label for="settingSelect">Setting</label>
          <select id="settingSelect">
            <option value="">—</option>
            <option value="home">Home</option>
            <option value="school">School</option>
            <option value="transitions">Transitions</option>
            <option value="public">Public</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="durationInput">Duration (min)</label>
          <input type="number" id="durationInput" min="0" step="1" placeholder="e.g. 15">
        </div>
      </div>

      <div class="field">
        <label>Intensity</label>
        <div class="intensity" id="intensityPicker">
          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="3">3</button>
          <button type="button" data-value="4">4</button>
          <button type="button" data-value="5">5</button>
        </div>
      </div>

      <div class="field">
        <label>Situation / demand (optional)</label>
        <div class="chips" id="situationChips"></div>
      </div>

      <div class="field">
        <label for="notesInput">Notes</label>
        <textarea id="notesInput" placeholder="What happened, what helped, anything else worth remembering"></textarea>
      </div>

      <div class="submit-row">
        <button type="submit" class="primary" id="submitBtn">Log entry</button>
      </div>
      <div class="status" id="formStatus"></div>
    </form>
  </section>

  <details class="daily-details">
    <summary>Daily context (sleep, exercise &amp; wetting incidents, optional)</summary>
    <form id="dailyForm">
      <div class="row">
        <div class="field">
          <label for="dailyDate">Date</label>
          <input type="date" id="dailyDate">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="bedtimeInput">Bedtime</label>
          <input type="time" id="bedtimeInput">
        </div>
        <div class="field">
          <label for="fellAsleepInput">Fell asleep</label>
          <input type="time" id="fellAsleepInput">
        </div>
        <div class="field">
          <label for="wakeTimeInput">Wake time</label>
          <input type="time" id="wakeTimeInput">
        </div>
        <div class="field">
          <label for="nightAwakeningsInput">Night awakenings</label>
          <input type="number" id="nightAwakeningsInput" min="0" step="1" placeholder="e.g. 1">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="exerciseMinutesInput">Exercise (min)</label>
          <input type="number" id="exerciseMinutesInput" min="0" step="1" placeholder="e.g. 30">
        </div>
        <div class="field">
          <label for="exerciseTypeSelect">Exercise type</label>
          <select id="exerciseTypeSelect">
            <option value="">—</option>
            <option value="cognitively-engaging">Cognitively engaging (martial arts, dance, strategy sport)</option>
            <option value="aerobic">Aerobic (running, biking, swimming)</option>
            <option value="other/mixed">Other / mixed</option>
          </select>
        </div>
      </div>
      <div class="submit-row">
        <button type="submit" class="primary" id="dailySubmitBtn">Save daily context</button>
      </div>
      <div class="status" id="dailyStatus"></div>
    </form>

    <div class="wetting-section">
      <div class="wetting-section-label">Wetting incidents for this date</div>
      <div class="wetting-list" id="wettingList"></div>
      <div class="row wetting-add-row">
        <div class="field">
          <label for="wettingTimeInput">Time</label>
          <input type="time" id="wettingTimeInput">
        </div>
        <div class="field">
          <label for="wettingSettingSelect">Where</label>
          <select id="wettingSettingSelect">
            <option value="">—</option>
            <option value="home">Home</option>
            <option value="school">School</option>
            <option value="transitions">Transitions</option>
            <option value="public">Public</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="wettingResponseSelect">Response</label>
          <select id="wettingResponseSelect">
            <option value="">—</option>
            <option value="compliant">Compliant</option>
            <option value="noncompliant">Noncompliant</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <button type="button" class="primary" id="addWettingBtn">Add incident</button>
        </div>
      </div>
      <div class="status" id="wettingStatus"></div>
    </div>
  </details>

  <section>
    <div class="toolbar">
      <div class="section-title" style="margin-bottom:0;">Entries</div>
      <div style="display:flex; gap:12px; align-items:center;">
        <select id="filterSelect">
          <option value="">All categories</option>
        </select>
        <button class="link-btn" id="exportBtn">Export CSV</button>
      </div>
    </div>
    <div id="entriesList"></div>
  </section>
</div>

<script>
const API = '/api';
let categories = [];
let situations = [];
let entries = [];
let dailyLogs = [];
let dailyLogMap = {};
let wettingIncidents = [];
let wettingByDate = {};

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function nowStr() {
  const d = new Date();
  return d.toTimeString().slice(0, 5);
}

// ---- logged-by name, per-browser ----
const loggedByInput = document.getElementById('loggedByInput');
loggedByInput.value = localStorage.getItem('loggedByName') || '';
loggedByInput.addEventListener('change', () => {
  localStorage.setItem('loggedByName', loggedByInput.value.trim());
});

// ---- defaults ----
document.getElementById('entryDate').value = todayStr();
document.getElementById('entryTime').value = nowStr();

// ---- category chips (multi-select) ----
let selectedCategories = new Set();
const categoryChips = document.getElementById('categoryChips');
const filterSelect = document.getElementById('filterSelect');

function renderCategoryChips() {
  categoryChips.innerHTML = '';
  categories.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedCategories.has(cat) ? ' selected' : '');
    chip.textContent = cat;
    chip.addEventListener('click', () => {
      if (selectedCategories.has(cat)) {
        selectedCategories.delete(cat);
      } else {
        selectedCategories.add(cat);
      }
      renderCategoryChips();
    });
    categoryChips.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip add-new';
  addChip.textContent = '+ new';
  addChip.addEventListener('click', async () => {
    const name = prompt('New category name:');
    if (!name || !name.trim()) return;
    await fetch(`${API}/categories`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim() })
    });
    await loadCategories();
    selectedCategories.add(name.trim().toLowerCase());
    renderCategoryChips();
  });
  categoryChips.appendChild(addChip);
}

function renderFilterOptions() {
  const current = filterSelect.value;
  filterSelect.innerHTML = '<option value="">All categories</option>';
  categories.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    filterSelect.appendChild(opt);
  });
  filterSelect.value = current;
}

async function loadCategories() {
  const res = await fetch(`${API}/categories`);
  categories = await res.json();
  renderCategoryChips();
  renderFilterOptions();
}

// ---- situation/demand chips (multi-select, optional) ----
let selectedSituations = new Set();
const situationChips = document.getElementById('situationChips');

function renderSituationChips() {
  situationChips.innerHTML = '';
  situations.forEach(sit => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedSituations.has(sit) ? ' selected' : '');
    chip.textContent = sit;
    chip.addEventListener('click', () => {
      if (selectedSituations.has(sit)) {
        selectedSituations.delete(sit);
      } else {
        selectedSituations.add(sit);
      }
      renderSituationChips();
    });
    situationChips.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip add-new';
  addChip.textContent = '+ new';
  addChip.addEventListener('click', async () => {
    const name = prompt('New situation/demand name:');
    if (!name || !name.trim()) return;
    await fetch(`${API}/situations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim() })
    });
    await loadSituations();
    selectedSituations.add(name.trim().toLowerCase());
    renderSituationChips();
  });
  situationChips.appendChild(addChip);
}

async function loadSituations() {
  const res = await fetch(`${API}/situations`);
  situations = await res.json();
  renderSituationChips();
}

// ---- daily context (sleep + exercise, one row per date, independent of
// how many behavior entries exist that day) ----
const dailyDateInput = document.getElementById('dailyDate');
const bedtimeInput = document.getElementById('bedtimeInput');
const fellAsleepInput = document.getElementById('fellAsleepInput');
const wakeTimeInput = document.getElementById('wakeTimeInput');
const nightAwakeningsInput = document.getElementById('nightAwakeningsInput');
const exerciseMinutesInput = document.getElementById('exerciseMinutesInput');
const exerciseTypeSelect = document.getElementById('exerciseTypeSelect');

function hasDailyContent(log) {
  return !!log && (
    log.bedtime != null || log.fell_asleep_time != null || log.wake_time != null ||
    log.night_awakenings != null || log.exercise_minutes != null || !!log.exercise_type
  );
}

function fmtDailySummary(log) {
  const parts = [];
  if (log.bedtime || log.fell_asleep_time || log.wake_time || log.night_awakenings != null) {
    let sleepPart = (log.bedtime || log.wake_time)
      ? `Sleep ${log.bedtime ? fmtTime(log.bedtime) : '?'}–${log.wake_time ? fmtTime(log.wake_time) : '?'}`
      : 'Sleep';
    if (log.fell_asleep_time) {
      sleepPart += ` (asleep ~${fmtTime(log.fell_asleep_time)})`;
    }
    if (log.night_awakenings != null) {
      sleepPart += ` · ${log.night_awakenings} waking${log.night_awakenings === 1 ? '' : 's'}`;
    }
    parts.push(sleepPart);
  }
  if (log.exercise_minutes != null || log.exercise_type) {
    let exPart = 'Exercise';
    if (log.exercise_minutes != null) exPart += ` ${log.exercise_minutes} min`;
    if (log.exercise_type) exPart += ` (${log.exercise_type})`;
    parts.push(exPart);
  }
  return parts.join('   ·   ');
}

function populateDailyFormForDate(dateStr) {
  const log = dailyLogMap[dateStr];
  bedtimeInput.value = log && log.bedtime ? log.bedtime.slice(0, 5) : '';
  fellAsleepInput.value = log && log.fell_asleep_time ? log.fell_asleep_time.slice(0, 5) : '';
  wakeTimeInput.value = log && log.wake_time ? log.wake_time.slice(0, 5) : '';
  nightAwakeningsInput.value = (log && log.night_awakenings != null) ? log.night_awakenings : '';
  exerciseMinutesInput.value = (log && log.exercise_minutes != null) ? log.exercise_minutes : '';
  exerciseTypeSelect.value = (log && log.exercise_type) ? log.exercise_type : '';
}

dailyDateInput.addEventListener('change', () => {
  populateDailyFormForDate(dailyDateInput.value);
  renderWettingListForDate(dailyDateInput.value);
});

async function loadDailyLogs() {
  const res = await fetch(`${API}/daily`);
  dailyLogs = await res.json();
  dailyLogMap = {};
  dailyLogs.forEach(l => { dailyLogMap[l.entry_date] = l; });
}

// ---- wetting incidents (any number per date, unlike the single-value
// sleep/exercise fields above -- each incident is its own row) ----
const wettingTimeInput = document.getElementById('wettingTimeInput');
const wettingSettingSelect = document.getElementById('wettingSettingSelect');
const wettingResponseSelect = document.getElementById('wettingResponseSelect');
const wettingList = document.getElementById('wettingList');
const wettingStatus = document.getElementById('wettingStatus');
const addWettingBtn = document.getElementById('addWettingBtn');

function fmtResponse(response) {
  return response === 'noncompliant' ? 'noncompliant' : response;
}

function renderWettingListForDate(dateStr) {
  const incidents = (wettingByDate[dateStr] || []);
  wettingList.innerHTML = '';
  if (!incidents.length) {
    wettingList.innerHTML = '<div class="wetting-empty">No wetting incidents logged for this date.</div>';
    return;
  }
  incidents.forEach(w => {
    const item = document.createElement('div');
    item.className = 'wetting-item';

    const time = document.createElement('div');
    time.className = 'entry-time';
    time.textContent = fmtTime(w.incident_time);
    item.appendChild(time);

    const respBadge = document.createElement('span');
    respBadge.className = 'badge' + (w.response === 'noncompliant' ? ' response-noncompliant' : '');
    respBadge.textContent = fmtResponse(w.response);
    item.appendChild(respBadge);

    const setting = document.createElement('div');
    setting.className = 'wetting-setting';
    setting.textContent = w.setting || '';
    item.appendChild(setting);

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = 'delete';
    delBtn.addEventListener('click', () => deleteWettingIncident(w.id));
    item.appendChild(delBtn);

    wettingList.appendChild(item);
  });
}

async function loadWettingIncidents() {
  const res = await fetch(`${API}/wetting`);
  wettingIncidents = await res.json();
  wettingByDate = {};
  wettingIncidents.forEach(w => {
    if (!wettingByDate[w.entry_date]) wettingByDate[w.entry_date] = [];
    wettingByDate[w.entry_date].push(w);
  });
}

async function deleteWettingIncident(id) {
  if (!confirm('Delete this incident?')) return;
  await fetch(`${API}/wetting/${id}`, { method: 'DELETE' });
  await loadWettingIncidents();
  renderWettingListForDate(dailyDateInput.value);
  renderEntries();
}

  addWettingBtn.disabled = true;
  try {
    const res = await fetch(`${API}/wetting`, {

    });

    wettingSettingSelect.value = '';

// ---- intensity picker ----
let selectedIntensity = null;
const intensityPicker = document.getElementById('intensityPicker');
intensityPicker.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {

// ---- entries ----
const entriesList = document.getElementById('entriesList');

function fmtDayHeading(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function fmtTime(t) {
  if (!t) return '—';
  const [h, m] = t.split(':');
  const hour = parseInt(h, 10);
  const ampm = hour >= 12 ? 'PM' : 'AM';
  const h12 = ((hour + 11) % 12) + 1;
  return `${h12}:${m} ${ampm}`;
}

function renderEntries() {
  const filter = filterSelect.value;
  const filtered = filter ? entries.filter(e => (e.categories || []).includes(filter)) : entries;

  const groups = {};
  filtered.forEach(e => {
    const key = e.entry_date;
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  // With no category filter active, also surface days that only have daily
  // context (sleep/exercise) logged and zero behavior entries -- a quiet
  // day is itself useful signal for spotting patterns. Skip this when a
  // filter is active since the point of filtering is to narrow to entries.
  if (!filter) {
    dailyLogs.forEach(log => {
      if (!groups[log.entry_date]) groups[log.entry_date] = [];
    });
    Object.keys(wettingByDate).forEach(dateStr => {
      if (!groups[dateStr]) groups[dateStr] = [];
    });
  }

  entriesList.innerHTML = '';
  const dateKeys = Object.keys(groups);
  if (!dateKeys.length) {
    entriesList.innerHTML = '<div class="empty">No entries logged yet.</div>';
    return;
  }

  dateKeys.sort((a, b) => b.localeCompare(a)).forEach(dateStr => {
    const group = document.createElement('div');
    group.className = 'day-group';
    const heading = document.createElement('div');
    heading.className = 'day-heading';
    heading.textContent = fmtDayHeading(dateStr);
    group.appendChild(heading);

    const dailyLog = dailyLogMap[dateStr];
    if (hasDailyContent(dailyLog)) {
      const summary = document.createElement('div');
      summary.className = 'daily-summary';
      summary.textContent = fmtDailySummary(dailyLog);
      group.appendChild(summary);
    }

    (wettingByDate[dateStr] || []).forEach(w => {
      const wRow = document.createElement('div');
      wRow.className = 'entry';

      const wTime = document.createElement('div');
      wTime.className = 'entry-time';
      wTime.textContent = fmtTime(w.incident_time);
      wRow.appendChild(wTime);

      const wBody = document.createElement('div');
      wBody.className = 'entry-body';
      const wHead = document.createElement('div');
      wHead.className = 'entry-head';

      const label = document.createElement('span');
      label.className = 'badge';
      label.textContent = 'Wetting incident';
      wHead.appendChild(label);

      const respBadge = document.createElement('span');
      respBadge.className = 'badge' + (w.response === 'noncompliant' ? ' response-noncompliant' : '');
      respBadge.textContent = fmtResponse(w.response);
      wHead.appendChild(respBadge);

      const wActions = document.createElement('span');
      wActions.className = 'entry-actions';
      const wDelBtn = document.createElement('button');
      wDelBtn.className = 'delete-btn';
      wDelBtn.textContent = 'delete';
      wDelBtn.addEventListener('click', () => deleteWettingIncident(w.id));
      wActions.appendChild(wDelBtn);
      wHead.appendChild(wActions);

      wBody.appendChild(wHead);

      if (w.setting) {
        const wMeta = document.createElement('div');
        wMeta.className = 'entry-meta';
        wMeta.textContent = w.setting;
        wBody.appendChild(wMeta);
      }

      wRow.appendChild(wBody);
      group.appendChild(wRow);
    });

    if (!groups[dateStr].length) {
      const dayEmpty = document.createElement('div');
      dayEmpty.className = 'day-empty';
      dayEmpty.textContent = 'No behavior entries logged.';
      group.appendChild(dayEmpty);
    }

    groups[dateStr].forEach(e => {
      const row = document.createElement('div');
      row.className = 'entry';

      const time = document.createElement('div');
      time.className = 'entry-time';
      time.textContent = fmtTime(e.entry_time);
      row.appendChild(time);

      const body = document.createElement('div');
      body.className = 'entry-body';

      const head = document.createElement('div');
      head.className = 'entry-head';

      (e.categories || []).forEach(cat => {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = cat;
        head.appendChild(badge);
      });

      (e.situations || []).forEach(sit => {
        const badge = document.createElement('span');
        badge.className = 'badge situation';
        badge.textContent = sit;
        head.appendChild(badge);
      });

      if (e.intensity) {
        const dots = document.createElement('span');
        dots.className = 'intensity-dots';
        for (let i = 1; i <= 5; i++) {
          const dot = document.createElement('span');
          dot.className = 'dot' + (i <= e.intensity ? ' on' : '');
          dots.appendChild(dot);
        }
        head.appendChild(dots);
      }

      const actions = document.createElement('span');
      actions.className = 'entry-actions';
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = 'delete';
      delBtn.addEventListener('click', () => deleteEntry(e.id));
      actions.appendChild(delBtn);
      head.appendChild(actions);

      body.appendChild(head);

      const metaParts = [];
      if (e.setting) metaParts.push(e.setting);
      if (e.duration_minutes) metaParts.push(`${e.duration_minutes} min`);
      if (e.logged_by) metaParts.push(`logged by ${e.logged_by}`);
      if (metaParts.length) {
        const meta = document.createElement('div');
        meta.className = 'entry-meta';
        meta.textContent = metaParts.join(' · ');
        body.appendChild(meta);
      }

      if (e.notes) {
        const notes = document.createElement('div');
        notes.className = 'entry-notes';
        notes.textContent = e.notes;
        body.appendChild(notes);
      }

      row.appendChild(body);
      group.appendChild(row);
    });

    entriesList.appendChild(group);
  });
}

async function loadEntries() {
  const res = await fetch(`${API}/entries`);
  entries = await res.json();
  renderEntries();
}

async function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  await fetch(`${API}/entries/${id}`, { method: 'DELETE' });
  await loadEntries();
}

filterSelect.addEventListener('change', renderEntries);

// ---- export CSV ----
document.getElementById('exportBtn').addEventListener('click', () => {
  const filter = filterSelect.value;
  const rows = filter ? entries.filter(e => (e.categories || []).includes(filter)) : entries;
  const headers = ['date', 'time', 'categories', 'setting', 'duration_minutes', 'intensity', 'situations', 'notes', 'logged_by'];
  const csvRows = [headers.join(',')];
  rows.forEach(e => {
    const line = headers.map(h => {
      const key = h === 'date' ? 'entry_date' : (h === 'time' ? 'entry_time' : h);
      let val;
      if (h === 'categories') {
        val = (e.categories || []).join('; ');
      } else if (h === 'situations') {
        val = (e.situations || []).join('; ');
      } else {
        val = e[key] == null ? '' : String(e[key]);
      }
      val = val.replace(/"/g, '""');
      if (val.includes(',') || val.includes('"') || val.includes('\n')) val = `"${val}"`;
      return val;
    });
    csvRows.push(line.join(','));
  });
  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `behavior-log-${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

// ---- form submit ----
const form = document.getElementById('entryForm');
const formStatus = document.getElementById('formStatus');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  formStatus.textContent = '';
  formStatus.classList.remove('error');

  if (selectedCategories.size === 0) {
    formStatus.textContent = 'Pick at least one category.';
    formStatus.classList.add('error');
    return;
  }

  const payload = {
    entry_date: document.getElementById('entryDate').value,
    entry_time: document.getElementById('entryTime').value || null,
    categories: Array.from(selectedCategories),
    setting: document.getElementById('settingSelect').value || null,
    duration_minutes: document.getElementById('durationInput').value ? parseInt(document.getElementById('durationInput').value, 10) : null,
    intensity: selectedIntensity,
    situations: Array.from(selectedSituations),
    notes: document.getElementById('notesInput').value || null,
    logged_by: loggedByInput.value.trim() || null,
  };

  submitBtn.disabled = true;
  try {
    const res = await fetch(`${API}/entries`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());

    // reset the parts of the form that shouldn't carry over
    selectedCategories = new Set();
    selectedSituations = new Set();
    selectedIntensity = null;
    renderCategoryChips();
    renderSituationChips();
    intensityPicker.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
    document.getElementById('durationInput').value = '';
    document.getElementById('notesInput').value = '';
    document.getElementById('entryTime').value = nowStr();

    await loadEntries();
    formStatus.textContent = 'Logged.';
  } catch (err) {
    formStatus.textContent = 'Could not save — check your connection and try again.';
    formStatus.classList.add('error');
  } finally {
    submitBtn.disabled = false;
  }
});
